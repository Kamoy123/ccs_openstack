apiVersion: v1
kind: Secret
metadata:
  name: mattermost-postgres-connection
  namespace: mattermost
type: Opaque
stringData:
  # PostgreSQL connection string
  # Format: postgres://username:password@host:port/database?options
  DB_CONNECTION_STRING: "postgres://mmuser:chocolateFrog!@postgres.mattermost.svc.cluster.local:5432/mattermost?connect_timeout=10"
  DB_CONNECTION_CHECK_URL: "postgres://mmuser:chocolateFrog!@postgres.mattermost.svc.cluster.local:5432/mattermost?connect_timeout=10"
  
  # Optional: If you have read replicas, add them here
  # MM_SQLSETTINGS_DATASOURCEREPLICAS: "postgres://mmuser:chocolateFrog!@postgres-replica.mattermost.svc.cluster.local:5432/mattermost?connect_timeout=10"
