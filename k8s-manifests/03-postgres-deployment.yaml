apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mattermost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Init container to fix permissions (runs as root)
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ['sh', '-c', 'mkdir -p /var/lib/postgresql/data/pgdata && chown -R 999:999 /var/lib/postgresql/data && chmod -R 700 /var/lib/postgresql/data']
        securityContext:
          runAsUser: 0  # Run as root
          privileged: true
        volumeMounts:
        - name: postgresdata
          mountPath: /var/lib/postgresql/data
      containers:
      - name: postgres
        image: postgres:15
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgresdata
        resources:  # resource requests and limits
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe: # health check for postgres container
          exec:
            command:
            - pg_isready
            - -U
            - mmuser
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe: # readiness check for postgres container
          exec:
            command:
            - pg_isready
            - -U
            - mmuser
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgresdata
        persistentVolumeClaim:
          claimName: postgres-pvc
--- # Create service for PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mattermost
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
