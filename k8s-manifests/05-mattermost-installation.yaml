# Mattermost Installation Manifest
# This is a template - replace ${INGRESS_IP} with your actual LoadBalancer IP
#
# To get your LoadBalancer IP:
#   kubectl get svc -n ingress-nginx nginx-ingress-ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
#
# Or use nip.io for automatic DNS resolution:
#   Replace: mattermost.${INGRESS_IP}.nip.io
#   With: mattermost.YOUR_IP_HERE.nip.io
#
apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: mattermost
  namespace: mattermost
spec:
  # Size determines resource allocation
  # Options: 100users, 1000users, 5000users, 10000users, 25000users
  size: 1000users
  
  # Mattermost version to deploy
  # See: https://docs.mattermost.com/product-overview/version-archive.html
  version: 9.11.0
  
  # Ingress configuration
  ingress:
    enabled: true
    # IMPORTANT: Replace ${INGRESS_IP} with your actual LoadBalancer IP
    host: mattermost.${INGRESS_IP}.nip.io
    annotations:
      kubernetes.io/ingress.class: nginx
      # Increase max upload size for file attachments
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      # Increase timeout for long-running requests
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      # Enable WebSocket support
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
  
  # External PostgreSQL database configuration
  database:
    external:
      secret: mattermost-postgres-connection
  
  # File storage configuration (using local PVC)
  # For production, consider using S3-compatible object storage
  fileStore:
    local:
      volumeClaim:
        name: mattermost-filestore-pvc
  
  # Mattermost environment variables
  mattermostEnv:
  - name: MM_SERVICESETTINGS_SITEURL
    # IMPORTANT: Replace ${INGRESS_IP} with your actual LoadBalancer IP
    value: "http://mattermost.${INGRESS_IP}.nip.io"
  - name: MM_SERVICESETTINGS_ENABLELOCALMODE
    value: "true"
  # Enable API v4
  - name: MM_SERVICESETTINGS_ENABLEAPIV4
    value: "true"
  # Set max file size (in bytes, 100MB)
  - name: MM_FILESETTINGS_MAXFILESIZE
    value: "104857600"
  # Enable email notifications (configure SMTP as needed)
  - name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS
    value: "false"
  
  # Resource configuration
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  
  # Number of Mattermost replicas
  # For single-server deployments without Enterprise license, use: replicas: 1
  # For Enterprise with HA, increase this number
  replicas: 1
  
  # License secret (optional, for Enterprise features)
  # licenseSecret: "mattermost-license"
