apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-volume
  # Note: PersistentVolumes are cluster-scoped resources, not namespaced
  labels:
    type: local
    app: postgres
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  # Use hostPath with DirectoryOrCreate to auto-create the directory
  hostPath:
    path: /mnt/data/postgresql
    type: DirectoryOrCreate